[package]
name = "cl650-installer-win"
description = "Windows installer window for the Challenger 650"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cl650-installer"
path = "src/main.rs"

[dependencies]
engine = { package = "cl650-installer-engine", path = "../installer-engine" }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1"
